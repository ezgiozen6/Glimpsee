<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Register</title>
        <link rel="stylesheet" href="css/signup.css">
        <script src="jssrc/RegisterApi.js" defer></script>
    </head>
    <body>
        <header>
            <h2>LoremIpsum</h2>
            <h4>Welcome to LoremIpsum</h4>
            <h5>Enter your information to sign up.</h5>
        </header>
        <main>
            <section class="signupbox">
                <label for="mail">Mail: </label>
                <input type="email" id="mail" name="mail" autocomplete="email">
                <br>
                <label for="username">Username: </label>
                <input type="text" id="username" name="username" autocomplete="username">
                <br>
                <label for="password">Password: </label>
                <input type="password" id="password" name="password" autocomplete="new-password">
                <br>
                <label for="confirm_password">Confirm Password: </label>
                <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password">
            </section>
            <section class="signupbutton">
                <input type="button" id="signup-button" value="SIGN UP">
            </section>
        </main>
    </body>
</html>
